<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Arcane Survivor 2D - Pixel War</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { background: #070b14; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; } /* Giữ nét pixel khi phóng to */
    .hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; pointer-events: none; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
    .xp-bar-wrap { width: 100%; height: 14px; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; border-radius: 999px; overflow: hidden; position: relative; }
    .xp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #a3e635); transition: width 0.12s ease-out; }
    .xp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 1px 2px #000; }
    .stats-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pill { background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(148, 163, 184, 0.28); padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; backdrop-filter: blur(4px); }
    .pill span { color: #a3e635; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(5, 9, 18, 0.92); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal-overlay.hidden { display: none; }
    .modal-title { font-size: 26px; font-weight: 900; color: #facc15; margin-bottom: 6px; text-align: center; text-shadow: 0 0 18px rgba(250, 204, 21, 0.45); }
    .modal-sub { font-size: 13px; color: #cbd5e1; margin-bottom: 18px; text-align: center; max-width: 400px; }
    .cards-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
    .upgrade-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #38bdf8; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s; text-align: left; }
    .upgrade-card:hover, .upgrade-card:active { transform: scale(1.02); border-color: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.3); }
    .card-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(56, 189, 248, 0.15); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .card-info h3 { font-size: 16px; color: #f8fafc; margin-bottom: 3px; }
    .card-info p { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .card-tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(250, 204, 21, 0.18); color: #facc15; margin-bottom: 4px; }
    .btn-primary { background: linear-gradient(135deg, #15803d, #16a34a); color: #fff; border: none; padding: 14px 32px; font-size: 16px; font-weight: 800; border-radius: 999px; cursor: pointer; margin-top: 12px; box-shadow: 0 8px 24px rgba(22, 163, 74, 0.5); }
    .btn-primary:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="hud">
    <div class="xp-bar-wrap">
      <div class="xp-bar-fill" id="xpFill"></div>
      <div class="xp-text" id="xpText">CẤP 1 — 0 / 20 XP</div>
    </div>
    <div class="stats-row">
      <div class="pill">⏱️ <span id="timeEl">00:00</span></div>
      <div class="pill">💀 Hạ gục: <span id="killsEl">0</span></div>
      <div class="pill">🛡️ Khiên: <span id="orbCountEl">1</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="modal-overlay" id="startModal">
    <div class="modal-title" id="startTitle">PIXEL SURVIVOR</div>
    <div class="modal-sub" id="startDesc">
      Điều khiển chiến binh pixel, tiêu diệt lũ quái vật đang tràn đến!<br><br>
      📱 <b>Điện thoại:</b> Chạm & kéo ngón tay bất kỳ đâu để di chuyển<br>
      💻 <b>Máy tính:</b> Dùng phím <b>WASD</b> hoặc <b>Mũi tên</b>
    </div>
    <button class="btn-primary" id="startBtn">BẮT ĐẦU TRẬN CHIẾN</button>
  </div>

  <div class="modal-overlay hidden" id="levelUpModal">
    <div class="modal-title">⬆️ LÊN CẤP!</div>
    <div class="modal-sub">Chọn 1 cường hóa vũ khí hoặc hỗ trợ:</div>
    <div class="cards-container" id="cardsContainer"></div>
  </div>
